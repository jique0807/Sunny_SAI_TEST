<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Sunny SAI · 레이더 중첩 시험실</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;color:#173b5a;background:#eaf2f7}
header{padding:10px 14px;background:white;display:flex;align-items:center;justify-content:space-between;gap:9px;border-bottom:1px solid #c9dcea}
h1{font-size:17px;margin:0}.tag{background:#e8efff;color:#214b82;padding:4px 7px;border-radius:8px;font-size:11px;font-weight:700}
#radarLabMap{height:calc(100dvh - 180px);min-height:320px;width:100%;position:relative}
#radarLabMap canvas{position:absolute;inset:0;pointer-events:none}
.panel{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(510px,calc(100vw - 16px));z-index:20;background:rgba(255,255,255,.98);border:1px solid #b4d5e8;border-radius:14px;box-shadow:0 7px 25px #132e4860;padding:11px 13px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
label{font-size:12px;font-weight:700}button,select{border:1px solid #b4cee2;border-radius:8px;background:#ecf8ff;color:#15476d;padding:9px 11px;font-weight:650}
button{cursor:pointer}button[aria-pressed=true]{background:#116aa3;color:white}input[type=range]{accent-color:#2088c9;flex:1;min-width:70px}
#status{font-size:12px;margin:5px 0;color:#2c5979;line-height:1.45}
.warning{font-size:10px;color:#8a5010;line-height:1.35;background:#fff5e8;padding:6px 8px;border-radius:6px}
#legend{display:flex;align-items:center;gap:7px;margin:4px 0 5px;font-size:11px}
.ramp{flex:1;height:8px;border-radius:7px;background:linear-gradient(90deg,#b7e9fc,#39b9ec,#1764b6,#d93d39,#ad2c9f)}
@media(max-width:560px){h1{font-size:15px}.row{gap:5px}button,select{padding:8px 6px;font-size:11px}
#radarLabMap{height:calc(100dvh - 190px)}}
</style></head>
<body>
<header><h1>Sunny SAI · 레이더 중첩 시험실</h1><span class="tag">프리뷰 전용 · 시험</span></header>
<div id="radarLabMap" aria-label="카카오 지도와 기상청 레이더 영상 중첩 시험"></div>
<div class="panel">
 <div class="row"><label for="radarMode">실제 레이더 자료</label>
 <select id="radarMode"><option value="case">과거 사례 · 2024.07.10 09:00</option>
 <option value="latest">최근 관측 시도 (KST)</option></select>
 <button id="radarLoad" type="button">자료 불러오기</button>
 <button id="radarToggle" type="button" aria-pressed="true">중첩 ON</button></div>
 <div class="row"><label for="radarOpacity">레이더 투명도</label>
 <input id="radarOpacity" type="range" min="10" max="90" value="56" step="5"/>
 <span id="radarOpacityValue">56%</span></div>
 <p id="status" role="status">기상청 HSR 배경 없는 영상과 투영좌표를 검증합니다.</p>
 <div id="legend"><span>레이더 반사도</span><div class="ramp"></div><span>낮음 → 높음</span></div>
 <div class="warning">이 화면은 연구용 중첩 시험입니다. 과거 자료는 현재 강수/도로위험이 아니며, 투영좌표 정합을 검증하기 전까지 운전 판단에 사용할 수 없습니다. KMA HSR은 예보가 아닌 관측 기반 자료입니다.</div>
</div>
<script type="module" src="/radar-lab.mjs"></script>
</body></html>
